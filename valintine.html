<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pihu ❤️ Ultimate Proposal</title>

<style>
body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at center, #1a001a, #000);
    color: white;
}

/* STARS */
.star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
    from { opacity: 0.3; }
    to { opacity: 1; }
}

.center {
    position: relative;
    z-index: 10;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    flex-direction: column;
    text-align: center;
}

/* BUTTONS */
button {
    padding: 12px 25px;
    border-radius: 30px;
    border: none;
    font-size: 18px;
    cursor: pointer;
    margin: 10px;
    background: hotpink;
    color: white;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.1);
}

#noBtn {
    position: absolute;
}

/* LOVE METER */
.meter {
    width: 200px;
    height: 15px;
    background: #333;
    border-radius: 20px;
    margin-top: 15px;
    overflow: hidden;
}

.fill {
    height: 100%;
    width: 0%;
    background: pink;
    transition: 0.5s;
}

/* HEART BEAT */
.heart {
    font-size: 40px;
    animation: beat 1s infinite;
}

@keyframes beat {
    0% { transform: scale(1); }
    50% { transform: scale(1.3); }
    100% { transform: scale(1); }
}

/* TYPEWRITER */
.typewriter {
    overflow: hidden;
    white-space: nowrap;
    border-right: 2px solid pink;
    width: 0;
    animation: typing 5s steps(50, end) forwards;
}

@keyframes typing {
    from { width: 0 }
    to { width: 100% }
}

/* RING BOX */
.ring-box {
    width: 120px;
    height: 80px;
    background: crimson;
    border-radius: 10px;
    position: relative;
    margin-top: 20px;
}

.lid {
    width: 120px;
    height: 40px;
    background: darkred;
    position: absolute;
    top: 0;
    border-radius: 10px 10px 0 0;
    transition: 1s;
    transform-origin: top;
}

.ring {
    position: absolute;
    top: 25px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 30px;
    opacity: 0;
    transition: 1s;
}

.open .lid {
    transform: rotateX(120deg);
}

.open .ring {
    opacity: 1;
    transform: translateX(-50%) translateY(-15px);
}

/* FIREWORK */
.firework {
    position: absolute;
    font-size: 25px;
    animation: explode 1s ease-out forwards;
}

@keyframes explode {
    from { transform: scale(0); opacity: 1; }
    to { transform: scale(3); opacity: 0; }
}
</style>
</head>

<body>

<div id="stars"></div>

<div class="center">
    <h1>Pihu ❤️ Will You Be Mine?</h1>
    <div class="heart">💖</div>

    <button onclick="yesClicked()">YES 💕</button>
    <button id="noBtn">NO 😢</button>

    <div class="meter">
        <div class="fill" id="fill"></div>
    </div>

    <div id="message" style="margin-top:20px;"></div>
</div>

<script>
// Stars
for(let i=0;i<150;i++){
    let s=document.createElement("div");
    s.className="star";
    s.style.left=Math.random()*100+"%";
    s.style.top=Math.random()*100+"%";
    s.style.animationDelay=Math.random()*2+"s";
    document.body.appendChild(s);
}

// NO button behavior
let love = 0;
const noBtn = document.getElementById("noBtn");
const fill = document.getElementById("fill");

noBtn.addEventListener("mouseover", function() {
    noBtn.style.left = Math.random() * (window.innerWidth - 100) + "px";
    noBtn.style.top = Math.random() * (window.innerHeight - 50) + "px";
    noBtn.style.transform = "scale(0.8)";
    love += 10;
    if(love > 100) love = 100;
    fill.style.width = love + "%";
});

// YES clicked
function yesClicked() {
    document.getElementById("message").innerHTML = `
        <div class="typewriter">
            Pihu... I promise to love you endlessly and protect your smile forever ❤️
        </div>
        <div class="ring-box open">
            <div class="lid"></div>
            <div class="ring">💍</div>
        </div>
    `;
    fireworks();
}

// Fireworks
function fireworks() {
    for(let i=0;i<40;i++){
        let f=document.createElement("div");
        f.innerHTML="🎆";
        f.className="firework";
        f.style.left=Math.random()*window.innerWidth+"px";
        f.style.top=Math.random()*window.innerHeight+"px";
        document.body.appendChild(f);
        setTimeout(()=>f.remove(),1000);
    }
}
</script>

</body>
</html>
